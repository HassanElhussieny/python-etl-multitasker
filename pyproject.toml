[project]
name = "sales-etl"
version = "1.0.0"
description = "Daily sales & returns ETL for Arabic ERP CSV exports"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sales-etl = "sales_etl.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
